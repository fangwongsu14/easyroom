<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | EasyRoom</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Prompt', sans-serif;
    background: #f5f7fb;
    color: #172033;
}

/* NAVBAR */

.navbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #2563eb;
    font-size: 22px;
    font-weight: 700;
}

.logo-icon {
    width: 39px;
    height: 39px;
    background: #2563eb;
    color: white;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 14px;
}

.user-name {
    font-size: 14px;
}

.logout {
    border: none;
    background: #fee2e2;
    color: #b91c1c;
    padding: 9px 14px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
}

/* HEADER */

.header {
    background: linear-gradient(135deg,#2563eb,#4f46e5);
    color: white;
    padding: 42px 6%;
}

.header-inner {
    max-width: 1150px;
    margin: auto;
}

.header h1 {
    font-size: 30px;
}

.header p {
    margin-top: 7px;
    opacity: .9;
}

/* CONTENT */

.container {
    max-width: 1150px;
    margin: auto;
    padding: 30px 20px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 21px;
    border-radius: 15px;
    box-shadow: 0 4px 18px rgba(15,23,42,.05);
}

.stat-label {
    color: #64748b;
    font-size: 13px;
}

.stat-number {
    display: block;
    font-size: 28px;
    font-weight: 600;
    margin-top: 5px;
}

/* PANELS */

.panel {
    background: white;
    border-radius: 16px;
    padding: 23px;
    margin-bottom: 22px;
    box-shadow: 0 4px 18px rgba(15,23,42,.05);
}

.panel-title {
    font-size: 19px;
    margin-bottom: 18px;
}

/* SEARCH */

.search {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr auto;
    gap: 10px;
    margin-bottom: 20px;
}

input,
select {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #d8dee8;
    border-radius: 9px;
    outline: none;
    font-family: inherit;
}

input:focus,
select:focus {
    border-color: #2563eb;
}

.btn {
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    font-family: inherit;
    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.primary:hover {
    background: #1d4ed8;
}

/* ROOM */

.rooms {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 18px;
}

.room {
    border: 1px solid #e8ebf0;
    border-radius: 14px;
    overflow: hidden;
}

.room-top {
    height: 110px;
    background: linear-gradient(135deg,#dbeafe,#e0e7ff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 42px;
}

.room-body {
    padding: 17px;
}

.room-body h3 {
    margin-bottom: 8px;
}

.detail {
    color: #64748b;
    font-size: 13px;
    margin: 5px 0;
}

.status {
    display: inline-block;
    margin: 9px 0;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
}

.available {
    background: #dcfce7;
    color: #15803d;
}

.pending {
    background: #fef3c7;
    color: #a16207;
}

.booked {
    background: #fee2e2;
    color: #b91c1c;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #edf0f4;
    text-align: left;
    font-size: 13px;
}

th {
    background: #f8fafc;
}

.cancel {
    background: #ef4444;
    color: white;
}

/* ADMIN */

.admin {
    display: none;
}

.admin-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 30px;
    color: #94a3b8;
}

/* RESPONSIVE */

@media(max-width:850px) {

    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .rooms {
        grid-template-columns: 1fr;
    }

    .search {
        grid-template-columns: 1fr;
    }
}

@media(max-width:550px) {

    .navbar {
        padding: 0 18px;
    }

    .user-name {
        display: none;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 35px 20px;
    }

}

</style>
</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">

        <div class="logo-icon">
            🏫
        </div>

        EasyRoom

    </div>


    <div class="user-area">

        <span
            class="user-name"
            id="userName">
            ผู้ใช้งาน
        </span>

        <button
            class="logout"
            onclick="logout()">

            ออกจากระบบ

        </button>

    </div>

</nav>


<!-- HEADER -->

<header class="header">

    <div class="header-inner">

        <h1 id="dashboardTitle">
            Dashboard
        </h1>

        <p id="welcome">
            ระบบจัดการห้องเรียน
        </p>

    </div>

</header>


<!-- CONTENT -->

<main class="container">


    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat">

            <span class="stat-label">
                ห้องทั้งหมด
            </span>

            <strong
                class="stat-number"
                id="totalRooms">
                0
            </strong>

        </div>


        <div class="stat">

            <span class="stat-label">
                ห้องว่าง
            </span>

            <strong
                class="stat-number"
                id="availableRooms">
                0
            </strong>

        </div>


        <div class="stat">

            <span class="stat-label">
                การจองของฉัน
            </span>

            <strong
                class="stat-number"
                id="myBookings">
                0
            </strong>

        </div>


        <div class="stat">

            <span class="stat-label">
                สิทธิ์ผู้ใช้งาน
            </span>

            <strong
                class="stat-number"
                style="font-size:19px"
                id="userRole">
                -
            </strong>

        </div>

    </section>


    <!-- ROOM SEARCH -->

    <section class="panel">

        <h2 class="panel-title">
            🔎 ค้นหาห้องเรียน
        </h2>


        <div class="search">

            <input
                id="search"
                placeholder="ค้นหาชื่อห้อง..."
            >


            <select id="building">

                <option value="">
                    ทุกอาคาร
                </option>

                <option value="อาคาร 1">
                    อาคาร 1
                </option>

                <option value="อาคาร 2">
                    อาคาร 2
                </option>

                <option value="อาคาร 3">
                    อาคาร 3
                </option>

            </select>


            <select id="type">

                <option value="">
                    ทุกประเภท
                </option>

                <option value="ห้องเรียน">
                    ห้องเรียน
                </option>

                <option value="ห้องคอมพิวเตอร์">
                    ห้องคอมพิวเตอร์
                </option>

                <option value="ห้องประชุม">
                    ห้องประชุม
                </option>

            </select>


            <button
                class="btn primary"
                onclick="searchRooms()">

                ค้นหา

            </button>

        </div>


        <div
            class="rooms"
            id="roomList">
        </div>

    </section>


    <!-- BOOKINGS -->

    <section class="panel">

        <h2 class="panel-title">
            📅 รายการจองของฉัน
        </h2>


        <div
            class="table-wrapper"
            id="bookingTable">
        </div>

    </section>


    <!-- ADMIN -->

    <section
        class="panel admin"
        id="adminPanel">

        <h2 class="panel-title">
            ⚙️ การจัดการระบบ
        </h2>


        <div class="admin-buttons">

            <button
                class="btn primary"
                onclick="adminMessage('ผู้ใช้งาน')">

                👥 จัดการผู้ใช้งาน

            </button>


            <button
                class="btn primary"
                onclick="adminMessage('ห้องเรียน')">

                🚪 จัดการห้องเรียน

            </button>


            <button
                class="btn primary"
                onclick="adminMessage('อาคาร')">

                🏢 จัดการอาคาร

            </button>


            <button
                class="btn primary"
                onclick="adminMessage('ประเภทห้อง')">

                🗂️ ประเภทห้อง

            </button>


            <button
                class="btn primary"
                onclick="adminMessage('รายงาน')">

                📊 รายงาน

            </button>

        </div>

    </section>

</main>


<script>

/* -----------------------------
   ROOM DATA
----------------------------- */

const rooms = [

    {
        id: 1,
        name: "ห้อง 101",
        building: "อาคาร 1",
        type: "ห้องเรียน",
        capacity: 40,
        icon: "🏫"
    },

    {
        id: 2,
        name: "ห้อง 102",
        building: "อาคาร 1",
        type: "ห้องเรียน",
        capacity: 40,
        icon: "🏫"
    },

    {
        id: 3,
        name: "ห้องคอม 201",
        building: "อาคาร 2",
        type: "ห้องคอมพิวเตอร์",
        capacity: 35,
        icon: "💻"
    },

    {
        id: 4,
        name: "ห้องคอม 202",
        building: "อาคาร 2",
        type: "ห้องคอมพิวเตอร์",
        capacity: 35,
        icon: "💻"
    },

    {
        id: 5,
        name: "ห้องประชุม 301",
        building: "อาคาร 3",
        type: "ห้องประชุม",
        capacity: 80,
        icon: "👥"
    },

    {
        id: 6,
        name: "ห้องประชุม 302",
        building: "อาคาร 3",
        type: "ห้องประชุม",
        capacity: 60,
        icon: "👥"
    }

];


/* -----------------------------
   USER
----------------------------- */

const user =
    JSON.parse(
        localStorage.getItem(
            "easyroom_user"
        ) || "null"
    );


if (!user) {

    window.location.href =
        "login.html";

}


/* -----------------------------
   BOOKINGS
----------------------------- */

let bookings =
    JSON.parse(
        localStorage.getItem(
            "easyroom_bookings"
        ) || "[]"
    );


/* -----------------------------
   DISPLAY USER
----------------------------- */

document.getElementById(
    "userName"
).textContent =
    user ? user.name : "";


document.getElementById(
    "dashboardTitle"
).textContent =
    user
    ? user.roleName + " Dashboard"
    : "Dashboard";


document.getElementById(
    "welcome"
).textContent =
    user
    ? "ยินดีต้อนรับคุณ " + user.name
    : "";


document.getElementById(
    "userRole"
).textContent =
    user
    ? user.roleName
    : "-";


/* -----------------------------
   ADMIN
----------------------------- */

if (
    user &&
    user.role === "admin"
) {

    document.getElementById(
        "adminPanel"
    ).style.display = "block";

}


/* -----------------------------
   ROOM RENDER
----------------------------- */

function renderRooms(list = rooms) {

    const container =
        document.getElementById(
            "roomList"
        );


    if (list.length === 0) {

        container.innerHTML =
            `<div class="empty">
                ไม่พบห้องที่ค้นหา
            </div>`;

        return;

    }


    container.innerHTML =
        list.map(room => {

            const booked =
                bookings.some(
                    booking =>
                        booking.roomId === room.id
                );


            return `

                <div class="room">

                    <div class="room-top">
                        ${room.icon}
                    </div>

                    <div class="room-body">

                        <h3>
                            ${room.name}
                        </h3>

                        <div class="detail">
                            🏢 ${room.building}
                        </div>

                        <div class="detail">
                            📚 ${room.type}
                        </div>

                        <div class="detail">
                            👥 รองรับ ${room.capacity} คน
                        </div>


                        <span
                            class="status ${
                                booked
                                ? "booked"
                                : "available"
                            }">

                            ${
                                booked
                                ? "ไม่ว่าง"
                                : "ว่าง"
                            }

                        </span>


                        <br>


                        <button
                            class="btn ${
                                booked
                                ? "cancel"
                                : "primary"
                            }"
                            onclick="${
                                booked
                                ? `viewBooking(${room.id})`
                                : `bookRoom(${room.id})`
                            }">

                            ${
                                booked
                                ? "ดูการจอง"
                                : "จองห้องนี้"
                            }

                        </button>

                    </div>

                </div>

            `;

        }).join("");


    updateStats();

}


/* -----------------------------
   SEARCH
----------------------------- */

function searchRooms() {

    const keyword =
        document.getElementById(
            "search"
        ).value
        .toLowerCase();


    const building =
        document.getElementById(
            "building"
        ).value;


    const type =
        document.getElementById(
            "type"
        ).value;


    const result =
        rooms.filter(room => {

            return (

                room.name
                    .toLowerCase()
                    .includes(keyword)

                &&

                (
                    !building ||
                    room.building === building
                )

                &&

                (
                    !type ||
                    room.type === type
                )

            );

        });


    renderRooms(result);

}


/* -----------------------------
   BOOK ROOM
----------------------------- */

function bookRoom(roomId) {

    const room =
        rooms.find(
            item => item.id === roomId
        );


    const date =
        prompt(
            "กรอกวันที่ต้องการจอง เช่น 2026-08-15"
        );


    if (!date) return;


    const start =
        prompt(
            "กรอกเวลาเริ่ม เช่น 09:00"
        );


    if (!start) return;


    const end =
        prompt(
            "กรอกเวลาสิ้นสุด เช่น 11:00"
        );


    if (!end) return;


    if (start >= end) {

        alert(
            "เวลาสิ้นสุดต้องมากกว่าเวลาเริ่ม"
        );

        return;

    }


    const duplicate =
        bookings.some(
            booking =>

                booking.roomId === roomId
                &&
                booking.date === date
                &&
                start < booking.end
                &&
                end > booking.start
        );


    if (duplicate) {

        alert(
            "ช่วงเวลานี้มีผู้จองห้องแล้ว"
        );

        return;

    }


    const booking = {

        id: Date.now(),

        roomId: roomId,

        roomName: room.name,

        username: user.name,

        date: date,

        start: start,

        end: end,

        status:
            user.role === "admin"
            ? "อนุมัติแล้ว"
            : "รออนุมัติ"

    };


    bookings.push(booking);


    localStorage.setItem(
        "easyroom_bookings",
        JSON.stringify(bookings)
    );


    alert(
        "ส่งคำขอจองห้องเรียบร้อยแล้ว"
    );


    renderRooms();

    renderBookings();

    updateStats();

}


/* -----------------------------
   BOOKINGS TABLE
----------------------------- */

function renderBookings() {

    const container =
        document.getElementById(
            "bookingTable"
        );


    let list;


    if (
        user &&
        user.role === "admin"
    ) {

        list = bookings;

    } else {

        list =
            bookings.filter(
                booking =>
                    booking.username ===
                    user.name
            );

    }


    document.getElementById(
        "myBookings"
    ).textContent =
        list.length;


    if (list.length === 0) {

        container.innerHTML =
            `<div class="empty">
                ยังไม่มีรายการจอง
            </div>`;

        return;

    }


    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>ห้อง</th>
                    <th>ผู้จอง</th>
                    <th>วันที่</th>
                    <th>เวลา</th>
                    <th>สถานะ</th>
                    <th>จัดการ</th>

                </tr>

            </thead>

            <tbody>

                ${
                    list.map(
                        booking => `

                        <tr>

                            <td>
                                ${booking.roomName}
                            </td>

                            <td>
                                ${booking.username}
                            </td>

                            <td>
                                ${booking.date}
                            </td>

                            <td>
                                ${booking.start}
                                -
                                ${booking.end}
                            </td>

                            <td>

                                <span
                                    class="status ${
                                        booking.status ===
                                        "อนุมัติแล้ว"
                                        ? "available"
                                        : "pending"
                                    }">

                                    ${booking.status}

                                </span>

                            </td>

                            <td>

                                <button
                                    class="btn cancel"
                                    onclick="cancelBooking(${booking.id})">

                                    ยกเลิก

                                </button>

                            </td>

                        </tr>

                    `
                    ).join("")
                }

            </tbody>

        </table>

    `;

}


/* -----------------------------
   CANCEL
----------------------------- */

function cancelBooking(id) {

    if (
        !confirm(
            "ต้องการยกเลิกการจองนี้หรือไม่?"
        )
    ) {

        return;

    }


    bookings =
        bookings.filter(
            booking =>
                booking.id !== id
        );


    localStorage.setItem(
        "easyroom_bookings",
        JSON.stringify(bookings)
    );


    renderRooms();

    renderBookings();

    updateStats();

}


/* -----------------------------
   VIEW BOOKING
----------------------------- */

function viewBooking(roomId) {

    const booking =
        bookings.find(
            item =>
                item.roomId === roomId
        );


    if (!booking) {

        alert(
            "ไม่พบข้อมูลการจอง"
        );

        return;

    }


    alert(

        "ห้อง: " +
        booking.roomName +

        "\nผู้จอง: " +
        booking.username +

        "\nวันที่: " +
        booking.date +

        "\nเวลา: " +
        booking.start +
        " - " +
        booking.end +

        "\nสถานะ: " +
        booking.status

    );

}


/* -----------------------------
   STATS
----------------------------- */

function updateStats() {

    const booked =
        new Set(
            bookings.map(
                booking =>
                    booking.roomId
            )
        ).size;


    document.getElementById(
        "totalRooms"
    ).textContent =
        rooms.length;


    document.getElementById(
        "availableRooms"
    ).textContent =
        rooms.length - booked;

}


/* -----------------------------
   ADMIN
----------------------------- */

function adminMessage(name) {

    alert(

        "เมนูจัดการ" +
        name +
        "\n\n" +
        "ส่วนนี้จะเชื่อมต่อฐานข้อมูลจริงในขั้นตอน Backend"

    );

}


/* -----------------------------
   LOGOUT
----------------------------- */

function logout() {

    localStorage.removeItem(
        "easyroom_user"
    );

    window.location.href =
        "login.html";

}


/* -----------------------------
   START
----------------------------- */

renderRooms();

renderBookings();

updateStats();

</script>

</body>
</html>
