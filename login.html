<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in — EasyRoom</title>

    <meta
        name="description"
        content="Sign in to EasyRoom"
    >

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600&display=swap');


        :root {

            --bg: #050706;

            --green: #8dffb8;
            --green-dark: #62e796;

            --text: #f4f7f5;
            --muted: #818a85;

            --border:
                rgba(255,255,255,.11);

            --glass:
                rgba(255,255,255,.055);

            --input:
                rgba(255,255,255,.045);

        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            font-family:
                "Inter",
                "Prompt",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:

                radial-gradient(
                    650px circle at 15% 15%,
                    rgba(98,231,150,.075),
                    transparent 55%
                ),

                radial-gradient(
                    600px circle at 85% 80%,
                    rgba(81,105,255,.055),
                    transparent 55%
                ),

                #050706;

            overflow: hidden;
        }


        /* =================================
           AMBIENT LIGHT
        ================================= */

        .ambient {

            position: fixed;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            background:
                rgba(110,255,161,.08);

            filter:
                blur(100px);

            pointer-events: none;

            animation:
                ambientMove 9s ease-in-out infinite;
        }


        .ambient.one {

            top: -220px;
            left: -150px;

        }


        .ambient.two {

            right: -220px;
            bottom: -180px;

            background:
                rgba(88,103,255,.065);

            animation-delay:
                -4s;

        }


        @keyframes ambientMove {

            0%,
            100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(35px,-25px);
            }

        }


        /* =================================
           PAGE
        ================================= */

        .page {

            width: 100%;

            max-width: 1050px;

            display: grid;

            grid-template-columns:
                .9fr 1.1fr;

            gap: 70px;

            align-items: center;
        }


        /* =================================
           LEFT SIDE
        ================================= */

        .intro {

            animation:
                fadeUp .8s ease both;
        }


        .brand {

            display: inline-flex;

            align-items: center;

            gap: 11px;

            margin-bottom: 40px;
        }


        .brand img {

            width: 42px;
            height: 42px;

            object-fit: contain;

            border-radius: 11px;
        }


        .brand span {

            font-size: 17px;

            font-weight: 700;

            letter-spacing:
                -.4px;
        }


        .intro h1 {

            max-width: 430px;

            font-size:
                clamp(42px,5vw,65px);

            line-height:
                .98;

            letter-spacing:
                -4px;
        }


        .intro h1 span {

            color:
                var(--green);

        }


        .intro p {

            max-width: 410px;

            margin-top: 22px;

            color:
                var(--muted);

            font-size: 14px;

            line-height:
                1.8;
        }


        .back {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 30px;

            color: #737c77;

            font-size: 12px;

            transition:
                color .2s,
                transform .2s;
        }


        .back:hover {

            color: white;

            transform:
                translateX(-3px);
        }


        /* =================================
           LOGIN CARD
        ================================= */

        .card-wrap {

            perspective:
                1200px;

            animation:
                cardIn .9s .1s ease both;
        }


        .login-card {

            position: relative;

            padding: 34px;

            border:
                1px solid
                rgba(255,255,255,.14);

            border-radius:
                26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.095),
                    rgba(255,255,255,.035)
                );

            backdrop-filter:
                blur(24px)
                saturate(1.35);

            -webkit-backdrop-filter:
                blur(24px)
                saturate(1.35);

            box-shadow:

                0 45px 100px
                rgba(0,0,0,.45),

                inset 0 1px 0
                rgba(255,255,255,.09);

            transform-style:
                preserve-3d;

            transition:
                transform .18s ease;
        }


        .login-card::before {

            content: "";

            position: absolute;

            inset: 0;

            border-radius:
                inherit;

            pointer-events: none;

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,.08),
                    transparent 30%
                );

            opacity:
                .7;
        }


        /* =================================
           CARD HEADER
        ================================= */

        .card-header {

            position: relative;

            margin-bottom: 29px;
        }


        .card-header .mini-logo {

            width: 44px;
            height: 44px;

            object-fit: contain;

            border-radius:
                12px;

            margin-bottom: 20px;
        }


        .card-header h2 {

            font-size: 27px;

            letter-spacing:
                -1px;

            margin-bottom: 7px;
        }


        .card-header p {

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                1.6;
        }


        /* =================================
           FORM
        ================================= */

        .form-group {

            position: relative;

            margin-bottom:
                15px;
        }


        .form-group label {

            display: block;

            margin-bottom:
                7px;

            color:
                #9ba39f;

            font-size:
                10px;

            font-weight:
                500;

            letter-spacing:
                .2px;
        }


        .input-wrap {

            position: relative;
        }


        .input-wrap input {

            width: 100%;

            height: 50px;

            padding:
                0 15px;

            border:
                1px solid
                rgba(255,255,255,.09);

            outline: none;

            border-radius:
                13px;

            background:
                rgba(0,0,0,.16);

            color:
                white;

            font-family:
                inherit;

            font-size:
                13px;

            transition:
                border-color .2s,
                background .2s,
                box-shadow .2s;
        }


        .input-wrap input::placeholder {

            color:
                #59625d;
        }


        .input-wrap input:focus {

            border-color:
                rgba(141,255,184,.35);

            background:
                rgba(141,255,184,.035);

            box-shadow:
                0 0 0 3px
                rgba(141,255,184,.055);
        }


        /* =================================
           PASSWORD
        ================================= */

        .password-input {

            padding-right:
                48px !important;
        }


        .toggle-password {

            position: absolute;

            top: 50%;
            right: 13px;

            transform:
                translateY(-50%);

            border: none;

            background: none;

            color:
                #68716c;

            cursor: pointer;

            font-size: 14px;

            padding: 5px;

            transition:
                color .2s;
        }


        .toggle-password:hover {

            color:
                #c4ccc7;
        }


        /* =================================
           OPTIONS
        ================================= */

        .options {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin:
                17px 1px 22px;
        }


        .remember {

            display: flex;

            align-items:
                center;

            gap: 8px;

            color:
                #858e89;

            font-size:
                10px;

            cursor: pointer;
        }


        .remember input {

            appearance: none;

            width: 15px;
            height: 15px;

            border:
                1px solid
                rgba(255,255,255,.15);

            border-radius:
                4px;

            background:
                rgba(255,255,255,.04);

            cursor: pointer;

            position: relative;
        }


        .remember input:checked {

            background:
                var(--green);

            border-color:
                var(--green);
        }


        .remember input:checked::after {

            content:
                "✓";

            position: absolute;

            color:
                #07120c;

            font-size:
                10px;

            font-weight:
                800;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%,-53%);
        }


        .forgot {

            color:
                var(--green);

            font-size:
                10px;

            transition:
                opacity .2s;
        }


        .forgot:hover {

            opacity:
                .7;
        }


        /* =================================
           SIGN IN BUTTON
        ================================= */

        .submit-btn {

            position: relative;

            width: 100%;

            height: 51px;

            border: none;

            border-radius:
                13px;

            background:
                linear-gradient(
                    135deg,
                    #a1ffc5,
                    #62e896
                );

            color:
                #07120c;

            font-family:
                inherit;

            font-size:
                12px;

            font-weight:
                700;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 13px 35px
                rgba(90,255,145,.13);

            transition:
                transform .2s,
                box-shadow .2s;
        }


        .submit-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 18px 42px
                rgba(90,255,145,.20);
        }


        .submit-btn:active {

            transform:
                translateY(1px)
                scale(.99);
        }


        .submit-btn.loading {

            pointer-events:
                none;

            color:
                transparent;
        }


        .submit-btn.success {

            background:
                linear-gradient(
                    135deg,
                    #8dffb8,
                    #5ee58f
                );
        }


        .spinner {

            position: absolute;

            width: 18px;
            height: 18px;

            border:
                2px solid
                rgba(0,0,0,.18);

            border-top-color:
                #07120c;

            border-radius:
                50%;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%,-50%);

            animation:
                spin .7s linear infinite;

            display: none;
        }


        .loading .spinner {

            display: block;
        }


        .check {

            display: none;

            font-size:
                18px;

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%,-50%);
        }


        .success .check {

            display: block;
        }


        @keyframes spin {

            to {
                transform:
                    translate(-50%,-50%)
                    rotate(360deg);
            }

        }


        /* =================================
           DIVIDER
        ================================= */

        .divider {

            display: flex;

            align-items:
                center;

            gap: 12px;

            margin:
                24px 0 18px;

            color:
                #555e59;

            font-size:
                9px;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,.07);
        }


        /* =================================
           SOCIAL
        ================================= */

        .social {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                9px;
        }


        .social button {

            height: 45px;

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius:
                11px;

            background:
                rgba(255,255,255,.035);

            color:
                #b4bbb7;

            cursor: pointer;

            font-family:
                inherit;

            font-size:
                11px;

            transition:
                background .2s,
                border-color .2s,
                transform .2s;
        }


        .social button:hover {

            background:
                rgba(255,255,255,.07);

            border-color:
                rgba(255,255,255,.15);

            transform:
                translateY(-1px);
        }


        .social-icon {

            margin-right:
                7px;

            font-weight:
                700;
        }


        /* =================================
           REGISTER
        ================================= */

        .signup {

            margin-top:
                25px;

            padding-top:
                20px;

            border-top:
                1px solid
                rgba(255,255,255,.06);

            text-align:
                center;

            color:
                #69726d;

            font-size:
                10px;
        }


        .signup a {

            color:
                var(--green);

            font-weight:
                600;

            margin-left:
                4px;
        }


        /* =================================
           ANIMATION
        ================================= */

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        @keyframes cardIn {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    rotateX(4deg);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    rotateX(0);
            }

        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 800px) {

            body {
                overflow:
                    auto;

                padding:
                    20px;
            }


            .page {

                grid-template-columns:
                    1fr;

                gap:
                    35px;

                max-width:
                    500px;
            }


            .intro {

                text-align:
                    center;
            }


            .brand {

                margin-bottom:
                    25px;
            }


            .intro h1 {

                margin:
                    auto;

                font-size:
                    46px;

                letter-spacing:
                    -3px;
            }


            .intro p {

                margin:
                    17px auto 0;
            }


            .back {

                margin-top:
                    20px;
            }


            .card-wrap {

                width:
                    100%;
            }

        }


        @media (max-width: 480px) {

            body {
                padding:
                    15px;
            }


            .intro h1 {

                font-size:
                    39px;

                letter-spacing:
                    -2.5px;
            }


            .intro p {

                font-size:
                    12px;
            }


            .login-card {

                padding:
                    25px 20px;

                border-radius:
                    22px;
            }


            .card-header h2 {

                font-size:
                    24px;
            }

        }

    </style>
</head>


<body>


    <div class="ambient one"></div>
    <div class="ambient two"></div>


    <main class="page">


        <!-- =========================
             INTRO
        ========================== -->

        <section class="intro">

            <a
                href="index.html"
                class="brand">

                <img
                    src="https://img1.pic.in.th/images/Screenshot-2026-08-10-at-00.21.21.png"
                    alt="EasyRoom"
                >

                <span>
                    EasyRoom
                </span>

            </a>


            <h1>

                Welcome
                <span>
                    back.
                </span>

            </h1>


            <p>

                Sign in to continue managing
                your rooms, bookings and
                schedules with EasyRoom.

            </p>


            <a
                href="index.html"
                class="back">

                ← Back to home

            </a>

        </section>



        <!-- =========================
             LOGIN CARD
        ========================== -->

        <section class="card-wrap">

            <div
                class="login-card"
                id="loginCard">


                <div class="card-header">

                    <img
                        class="mini-logo"
                        src="https://img1.pic.in.th/images/Screenshot-2026-08-10-at-00.21.21.png"
                        alt="EasyRoom Logo"
                    >

                    <h2>
                        Sign in
                    </h2>

                    <p>
                        Enter your account details
                        to continue.
                    </p>

                </div>



                <form
                    id="loginForm">


                    <!-- Username -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-wrap">

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>



                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrap">

                            <input
                                class="password-input"
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Show password">

                                ◉

                            </button>

                        </div>

                    </div>



                    <!-- Options -->

                    <div class="options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            Remember me

                        </label>


                        <a
                            href="#"
                            class="forgot">

                            Forgot password?

                        </a>

                    </div>



                    <!-- Submit -->

                    <button
                        class="submit-btn"
                        id="submitBtn"
                        type="submit">

                        <span class="button-text">
                            Sign In
                        </span>

                        <span class="spinner"></span>

                        <span class="check">
                            ✓
                        </span>

                    </button>


                </form>



                <!-- Divider -->

                <div class="divider">

                    or continue with

                </div>



                <!-- Social -->

                <div class="social">

                    <button
                        type="button">

                        <span class="social-icon">
                            G
                        </span>

                        Google

                    </button>


                    <button
                        type="button">

                        <span class="social-icon">
                            
                        </span>

                        Apple

                    </button>

                </div>



                <!-- Signup -->

                <div class="signup">

                    New to EasyRoom?

                    <a
                        href="register.html">

                        Create account

                    </a>

                </div>


            </div>

        </section>

    </main>



    <script>

        /* =================================
           PASSWORD VISIBILITY
        ================================= */

        const password =
            document.getElementById(
                "password"
            );

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        togglePassword.addEventListener(
            "click",
            () => {

                const visible =
                    password.type ===
                    "text";


                password.type =
                    visible
                        ? "password"
                        : "text";


                togglePassword.textContent =
                    visible
                        ? "◉"
                        : "◌";

            }
        );



        /* =================================
           3D CARD TILT
        ================================= */

        const card =
            document.getElementById(
                "loginCard"
            );


        const cardWrap =
            document.querySelector(
                ".card-wrap"
            );


        if (
            window.innerWidth > 800
        ) {

            cardWrap.addEventListener(
                "pointermove",
                (event) => {

                    const rect =
                        cardWrap.getBoundingClientRect();


                    const x =
                        event.clientX -
                        rect.left;


                    const y =
                        event.clientY -
                        rect.top;


                    const rotateY =
                        ((x -
                            rect.width / 2) /
                            rect.width) *
                        7;


                    const rotateX =
                        ((rect.height / 2 -
                            y) /
                            rect.height) *
                        7;


                    card.style.transform =
                        `
                        rotateX(${rotateX}deg)
                        rotateY(${rotateY}deg)
                        translateY(-3px)
                        `;

                }
            );


            cardWrap.addEventListener(
                "pointerleave",
                () => {

                    card.style.transform =
                        `
                        rotateX(0deg)
                        rotateY(0deg)
                        translateY(0)
                        `;

                }
            );

        }



        /* =================================
           LOGIN STATE
        ================================= */

        const form =
            document.getElementById(
                "loginForm"
            );


        const submitBtn =
            document.getElementById(
                "submitBtn"
            );


        const buttonText =
            submitBtn.querySelector(
                ".button-text"
            );


        form.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();


                submitBtn.classList.add(
                    "loading"
                );


                buttonText.textContent =
                    "Signing in...";


                setTimeout(
                    () => {

                        submitBtn.classList.remove(
                            "loading"
                        );


                        submitBtn.classList.add(
                            "success"
                        );


                        buttonText.textContent =
                            "Success";


                        setTimeout(
                            () => {

                                /*
                                 * ตอนมี Backend จริง
                                 * เปลี่ยนตรงนี้เป็น
                                 *
                                 * window.location.href =
                                 * "dashboard.html";
                                 */

                            },
                            800
                        );

                    },
                    1100
                );

            }
        );

    </script>

</body>
</html>
